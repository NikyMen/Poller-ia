<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Polleria Entre Rios</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section id="loginView" class="login-panel" hidden>
        <div>
          <p class="eyebrow">Polleria Entre Rios</p>
          <h1>Panel de IA</h1>
        </div>

        <form id="loginForm" class="form">
          <label>
            Usuario
            <input id="username" name="username" autocomplete="username" required>
          </label>
          <label>
            Clave
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit">Ingresar</button>
          <p id="loginError" class="error" role="alert"></p>
        </form>
      </section>

      <section id="appView" class="dashboard" hidden>
        <header class="topbar">
          <div>
            <p class="eyebrow">Polleria Entre Rios</p>
            <h1>Telefonos con IA</h1>
          </div>
          <button id="logoutBtn" class="secondary" type="button">Salir</button>
        </header>

        <form id="manualForm" class="manual-form">
          <label>
            Telefono para intervenir
            <input id="manualPhone" placeholder="Ej: 3430000000" inputmode="tel" required>
          </label>
          <button type="submit">Desactivar IA</button>
        </form>

        <div class="toolbar">
          <input id="searchInput" placeholder="Buscar telefono o cliente">
          <button id="refreshBtn" class="secondary" type="button">Actualizar</button>
        </div>

        <div id="statusMessage" class="status"></div>
        <div id="phonesList" class="list"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
