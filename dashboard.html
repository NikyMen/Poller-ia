<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel IA - Polleria Entre Rios</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="panel-page">
    <main class="shell">
      <section class="dashboard">
        <header class="topbar">
          <div>
            <p class="eyebrow">Polleria Entre Rios</p>
            <h1>Control de bots</h1>
          </div>
          <div class="topbar-actions">
            <button id="shutdownSalesBotBtn" class="danger" type="button">Apagar bot de ventas</button>
            <button id="logoutBtn" class="secondary" type="button">Salir</button>
          </div>
        </header>

        <div class="toolbar">
          <input id="searchInput" placeholder="Buscar telefono o lead">
          <button id="refreshBtn" class="secondary" type="button">Actualizar</button>
        </div>

        <div id="statusMessage" class="status"></div>
        <div id="phonesList" class="list"></div>
      </section>
    </main>

    <div id="shutdownModal" class="modal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="shutdownTitle">
        <h2 id="shutdownTitle">Apagando bot de ventas</h2>
        <p id="shutdownMessage">El boton final se habilitara en <strong id="shutdownCountdown">5</strong> segundos.</p>
        <div class="modal-actions">
          <button id="cancelShutdownBtn" class="secondary" type="button">Cancelar</button>
          <button id="confirmShutdownBtn" class="danger" type="button" disabled>Confirmar apagado</button>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
